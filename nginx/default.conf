# Configuration Nginx pour WordPress
# Ce fichier est monté dans le container Nginx via bind mount

server {
    listen 80;
    server_name localhost;
    
    # Racine du site WordPress (Bedrock : sous-dossier "web")
    root /var/www/web;
    index index.php index.html index.htm;

    # Logs (optionnel, pour le débogage)
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Taille maximale des uploads (doit correspondre à PHP)
    client_max_body_size 64M;

    # Configuration principale pour WordPress
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Gestion des fichiers PHP via PHP-FPM
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;  # Nom du service PHP dans docker-compose
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        # Timeouts pour les uploads importants
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
    }

    # Blocage de l'accès aux fichiers sensibles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Blocage de l'accès aux fichiers de configuration WordPress
    location ~* wp-config.php {
        deny all;
    }

    # Optimisation : cache des fichiers statiques
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Blocage de l'accès aux fichiers de sauvegarde
    location ~* \.(sql|tar|gz|zip)$ {
        deny all;
    }
}
